name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject tokens into HTML
        run: |
          # index.html uses Actions token (only triggers workflow_dispatch)
          sed -i "s|__SURVEY_TOKEN__|${{ secrets.ACTIONS_TOKEN }}|g" index.html
          # admin.html uses Issues token (reads issues)
          sed -i "s|__SURVEY_TOKEN__|${{ secrets.ISSUES_TOKEN }}|g" admin.html

      - uses: actions/configure-pages@v4
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
